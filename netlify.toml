# Netlify build settings for the Leaf Genix storefront.
# Next.js is served through Netlify's OpenNext adapter (@netlify/plugin-nextjs),
# which handles the App Router, proxy.ts, image optimisation and route caching.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  # These values are intentionally public configuration/content. Keep secret
  # scanning enabled for Supabase, Razorpay and Resend credentials.
  SECRETS_SCAN_OMIT_KEYS = "LEAD_NOTIFICATION_EMAIL,RESEND_FROM_EMAIL,NEXT_PUBLIC_SITE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Free Supabase projects may pause after a low-activity week. This performs a
# small real database read three times daily from the published Netlify site.
[functions."supabase-keepalive"]
  schedule = "0 */8 * * *"
